<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Pro | Ultimate Forecast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: white;
            transition: background-image 1s ease-in-out;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        
        /* Glassmorphism */
        .glass {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Overlay to darken background images for readability */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        /* Loading Spinner */
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #3b82f6;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1); 
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2); 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.3); 
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-overlay"></div>

    <div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-3 gap-6 relative z-10">
        
        <!-- Sidebar / Main Controls -->
        <div class="glass rounded-3xl p-8 flex flex-col justify-between h-full min-h-[500px] lg:col-span-1">
            <div>
                <!-- Search -->
                <div class="relative mb-8">
                    <input type="text" id="cityInput" placeholder="Search city..." 
                        class="w-full bg-slate-800/50 text-white placeholder-slate-400 rounded-2xl py-3 px-12 focus:outline-none focus:ring-2 focus:ring-blue-500 border border-slate-700 transition">
                    <i class="fas fa-search absolute left-4 top-3.5 text-slate-400"></i>
                    <button id="locateBtn" class="absolute right-3 top-2 p-1.5 bg-blue-600 rounded-lg hover:bg-blue-700 transition" title="Use My Location">
                        <i class="fas fa-location-arrow text-sm"></i>
                    </button>
                </div>

                <!-- Current Weather Big Display -->
                <div id="currentWeather" class="text-center mt-8">
                    <div class="mb-4">
                        <img id="weatherIcon" src="" alt="Weather Icon" class="w-32 h-32 mx-auto drop-shadow-2xl filter brightness-110">
                    </div>
                    <h1 id="tempDisplay" class="text-7xl font-light mb-2 tracking-tighter">--°</h1>
                    <h2 id="cityDisplay" class="text-2xl font-bold mb-1">Select a City</h2>
                    <p id="descDisplay" class="text-slate-300 capitalize mb-6 text-lg">--</p>
                    
                    <div class="h-px w-full bg-gradient-to-r from-transparent via-slate-500 to-transparent my-6 opacity-30"></div>

                    <div class="grid grid-cols-2 gap-4 text-left">
                        <div class="glass-panel p-4 flex items-center gap-3">
                            <i class="fas fa-tint text-blue-400 text-xl"></i>
                            <div>
                                <p class="text-xs text-slate-400">Humidity</p>
                                <p id="humidityDisplay" class="font-semibold">--%</p>
                            </div>
                        </div>
                        <div class="glass-panel p-4 flex items-center gap-3">
                            <i class="fas fa-wind text-teal-400 text-xl"></i>
                            <div>
                                <p class="text-xs text-slate-400">Wind</p>
                                <p id="windDisplay" class="font-semibold">-- km/h</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-8 text-center">
                <p id="dateDisplay" class="text-slate-400 text-sm font-medium">--</p>
            </div>
        </div>

        <!-- Dashboard / Details & Forecast -->
        <div class="lg:col-span-2 flex flex-col gap-6">
            
            <!-- Highlights Grid -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="glass rounded-2xl p-4 text-center">
                    <p class="text-slate-400 text-xs mb-1">Feels Like</p>
                    <p id="feelsLikeDisplay" class="text-xl font-bold">--°</p>
                </div>
                <div class="glass rounded-2xl p-4 text-center">
                    <p class="text-slate-400 text-xs mb-1">Visibility</p>
                    <p id="visibilityDisplay" class="text-xl font-bold">-- km</p>
                </div>
                <div class="glass rounded-2xl p-4 text-center">
                    <p class="text-slate-400 text-xs mb-1">Pressure</p>
                    <p id="pressureDisplay" class="text-xl font-bold">-- hPa</p>
                </div>
                <div class="glass rounded-2xl p-4 text-center">
                    <p class="text-slate-400 text-xs mb-1">UV Index</p>
                    <p class="text-xl font-bold text-yellow-400">Medium</p>
                </div>
            </div>

            <!-- Chart Section -->
            <div class="glass rounded-3xl p-6 relative">
                <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
                    <i class="fas fa-chart-line text-blue-400"></i> Temperature Trend (24h)
                </h3>
                <div class="h-48 w-full">
                    <canvas id="tempChart"></canvas>
                </div>
            </div>

            <!-- 5 Day Forecast -->
            <div class="glass rounded-3xl p-6 flex-grow">
                <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
                    <i class="fas fa-calendar-alt text-purple-400"></i> 5-Day Forecast
                </h3>
                <div id="forecastContainer" class="grid grid-cols-2 md:grid-cols-5 gap-4">
                    <!-- Forecast items will be injected here -->
                    <div class="glass-panel p-3 text-center animate-pulse">
                        <div class="h-4 bg-slate-700 rounded w-1/2 mx-auto mb-2"></div>
                        <div class="h-8 bg-slate-700 rounded w-full mb-2"></div>
                        <div class="h-4 bg-slate-700 rounded w-1/2 mx-auto"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Hidden Error Toast -->
    <div id="errorToast" class="fixed bottom-5 right-5 bg-red-600 text-white px-6 py-3 rounded-lg shadow-xl transform translate-y-20 transition-transform duration-300 flex items-center gap-3">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorText">City not found!</span>
    </div>

    <script>
        const API_KEY = "67cc12742121280228988d04fc6f199d"; // Provided key
        const BASE_URL = "https://api.openweathermap.org/data/2.5";
        
        // DOM Elements
        const cityInput = document.getElementById('cityInput');
        const locateBtn = document.getElementById('locateBtn');
        const errorToast = document.getElementById('errorToast');
        
        let tempChartInstance = null;

        // Initialize with default city
        window.addEventListener('load', () => {
            fetchWeather('Sydney');
        });

        // Event Listeners
        cityInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const city = cityInput.value.trim();
                if (city) fetchWeather(city);
            }
        });

        locateBtn.addEventListener('click', () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const { latitude, longitude } = position.coords;
                    fetchWeatherByCoords(latitude, longitude);
                }, () => showError("Location access denied."));
            } else {
                showError("Geolocation not supported.");
            }
        });

        async function fetchWeather(city) {
            try {
                // Current Weather
                const weatherRes = await fetch(`${BASE_URL}/weather?q=${city}&units=metric&appid=${API_KEY}`);
                if (!weatherRes.ok) throw new Error('City not found');
                const weatherData = await weatherRes.json();
                
                // Forecast
                const forecastRes = await fetch(`${BASE_URL}/forecast?q=${city}&units=metric&appid=${API_KEY}`);
                const forecastData = await forecastRes.json();

                updateUI(weatherData, forecastData);
                updateBackground(weatherData.weather[0].main);

            } catch (error) {
                console.error(error);
                showError(error.message);
            }
        }

        async function fetchWeatherByCoords(lat, lon) {
            try {
                const weatherRes = await fetch(`${BASE_URL}/weather?lat=${lat}&lon=${lon}&units=metric&appid=${API_KEY}`);
                const weatherData = await weatherRes.json();
                
                const forecastRes = await fetch(`${BASE_URL}/forecast?lat=${lat}&lon=${lon}&units=metric&appid=${API_KEY}`);
                const forecastData = await forecastRes.json();

                updateUI(weatherData, forecastData);
                updateBackground(weatherData.weather[0].main);
            } catch (error) {
                showError("Could not fetch weather data.");
            }
        }

        function updateUI(current, forecast) {
            // Update Current Weather
            document.getElementById('tempDisplay').textContent = `${Math.round(current.main.temp)}°`;
            document.getElementById('cityDisplay').textContent = `${current.name}, ${current.sys.country}`;
            document.getElementById('descDisplay').textContent = current.weather[0].description;
            document.getElementById('humidityDisplay').textContent = `${current.main.humidity}%`;
            document.getElementById('windDisplay').textContent = `${(current.wind.speed * 3.6).toFixed(1)} km/h`;
            document.getElementById('weatherIcon').src = `https://openweathermap.org/img/wn/${current.weather[0].icon}@4x.png`;
            
            // Details
            document.getElementById('feelsLikeDisplay').textContent = `${Math.round(current.main.feels_like)}°`;
            document.getElementById('visibilityDisplay').textContent = `${(current.visibility / 1000).toFixed(1)} km`;
            document.getElementById('pressureDisplay').textContent = `${current.main.pressure} hPa`;
            
            // Date
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('en-US', options);

            // Update Chart
            updateChart(forecast.list.slice(0, 8)); // Next 24 hours (3h intervals)

            // Update 5-Day Forecast
            updateForecastGrid(forecast.list);
        }

        function updateForecastGrid(list) {
            const container = document.getElementById('forecastContainer');
            container.innerHTML = '';
            
            // Filter to get roughly one per day (every 8th item is +24h)
            const dailyData = [];
            for(let i=7; i < list.length; i+=8) {
                dailyData.push(list[i]);
            }

            dailyData.forEach(day => {
                const date = new Date(day.dt * 1000);
                const dayName = date.toLocaleDateString('en-US', { weekday: 'short' });
                const icon = day.weather[0].icon;
                const temp = Math.round(day.main.temp);

                const card = document.createElement('div');
                card.className = 'glass-panel p-3 text-center flex flex-col items-center justify-center hover:bg-white/10 transition';
                card.innerHTML = `
                    <p class="text-slate-300 text-sm font-medium mb-1">${dayName}</p>
                    <img src="https://openweathermap.org/img/wn/${icon}@2x.png" class="w-10 h-10 mb-1">
                    <p class="text-lg font-bold">${temp}°</p>
                `;
                container.appendChild(card);
            });
        }

        function updateChart(hourlyData) {
            const ctx = document.getElementById('tempChart').getContext('2d');
            
            const labels = hourlyData.map(item => {
                const date = new Date(item.dt * 1000);
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            });
            const temps = hourlyData.map(item => item.main.temp);

            if (tempChartInstance) {
                tempChartInstance.destroy();
            }

            // Gradient for line
            const gradient = ctx.createLinearGradient(0, 0, 0, 200);
            gradient.addColorStop(0, 'rgba(59, 130, 246, 0.5)'); // Blue
            gradient.addColorStop(1, 'rgba(59, 130, 246, 0)');

            tempChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Temp (°C)',
                        data: temps,
                        borderColor: '#60a5fa',
                        backgroundColor: gradient,
                        borderWidth: 3,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#3b82f6',
                        pointRadius: 4,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: { 
                            grid: { display: false },
                            ticks: { color: 'rgba(255,255,255,0.6)' }
                        },
                        y: { 
                            display: false, // Hide Y axis for cleaner look
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        function updateBackground(weatherMain) {
            let imageUrl = '';
            
            // Dynamic Unsplash Image based on weather condition
            switch(weatherMain.toLowerCase()) {
                case 'clear':
                    imageUrl = 'https://images.unsplash.com/photo-1601297183305-6df142704ea2?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80';
                    break;
                case 'clouds':
                    imageUrl = 'https://images.unsplash.com/photo-1534088568595-a066f410bcda?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80';
                    break;
                case 'rain':
                case 'drizzle':
                    imageUrl = 'https://images.unsplash.com/photo-1519692933481-e162a57d6721?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80';
                    break;
                case 'thunderstorm':
                    imageUrl = 'https://images.unsplash.com/photo-1605727216801-e27ce1d0cc28?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80';
                    break;
                case 'snow':
                    imageUrl = 'https://images.unsplash.com/photo-1478265409131-1f65c88f965c?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80';
                    break;
                case 'mist':
                case 'fog':
                    imageUrl = 'https://images.unsplash.com/photo-1485230905346-71acb9518d9c?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80';
                    break;
                default:
                    imageUrl = 'https://images.unsplash.com/photo-1592210454359-9043f067919b?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80';
            }

            document.body.style.backgroundImage = `url('${imageUrl}')`;
        }

        function showError(msg) {
            const toast = document.getElementById('errorToast');
            document.getElementById('errorText').textContent = msg;
            toast.classList.remove('translate-y-20');
            setTimeout(() => {
                toast.classList.add('translate-y-20');
            }, 3000);
        }
    </script>
</body>
</html>
